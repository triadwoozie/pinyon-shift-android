# Pinyon Shift manifest for the ABI poison checking build (NEXT_LEVEL_RESEARCH.md
# NL-0.1): the base game's inputs and analysis, generated into a tree of its own
# because the generator wraps every guest call in checks there
# (PINYON_SHIFT_RECOMP_ABI_POISON, rexglue codegen --abi-poison).

[project]
name = "pinyon_shift"
sdk_version = "0.10.0"
game_root = "../../.local/game/base"

[entrypoint]
file_path = "../../.local/game/base/default.xex"
out_directory_path = "../../.local/generated-abipoison/default"
includes = ["analysis/main-xex.toml"]

[[modules]]
guest_path = "SpeechFacade_default.xex"
file_path = "../../.local/game/base/SpeechFacade_default.xex"
out_directory_path = "../../.local/generated-abipoison/speech"
includes = ["analysis/speech-facade.toml"]

[[modules]]
guest_path = "XMediaFacade_default.xex"
file_path = "../../.local/game/base/XMediaFacade_default.xex"
out_directory_path = "../../.local/generated-abipoison/xmedia"
includes = ["analysis/xmedia-facade.toml"]
