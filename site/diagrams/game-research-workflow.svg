<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-label="How a finding is made: a question, static reading, a probe, verification, and a record"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="40" width="152" height="110" rx="6" class="guest"/><text x="86.0" y="76.0" text-anchor="middle" class="t-head">1  Question</text><text x="86.0" y="92.0" text-anchor="middle" class="t-small">what decides the</text><text x="86.0" y="107.0" text-anchor="middle" class="t-small">car LOD? where are</text><text x="86.0" y="122.0" text-anchor="middle" class="t-small">the credits?</text><rect x="178" y="40" width="152" height="110" rx="6" class="box"/><text x="254.0" y="76.0" text-anchor="middle" class="t-head">2  Read</text><text x="254.0" y="92.0" text-anchor="middle" class="t-small">strings, RTTI, data</text><text x="254.0" y="107.0" text-anchor="middle" class="t-small">files, generated C++</text><text x="254.0" y="122.0" text-anchor="middle" class="t-small">callers and offsets</text><path d="M162 95 L176 95" class="edge" marker-end="url(#arrow)"/><rect x="346" y="40" width="152" height="110" rx="6" class="host"/><text x="422.0" y="76.0" text-anchor="middle" class="t-head">3  Probe</text><text x="422.0" y="92.0" text-anchor="middle" class="t-small">mid-asm hook or</text><text x="422.0" y="107.0" text-anchor="middle" class="t-small">probe mod reads and</text><text x="422.0" y="122.0" text-anchor="middle" class="t-small">writes guest memory</text><path d="M330 95 L344 95" class="edge" marker-end="url(#arrow)"/><rect x="514" y="40" width="152" height="110" rx="6" class="gpu"/><text x="590.0" y="76.0" text-anchor="middle" class="t-head">4  Verify</text><text x="590.0" y="92.0" text-anchor="middle" class="t-small">scripted route from</text><text x="590.0" y="107.0" text-anchor="middle" class="t-small">a pinned seed, A/B</text><text x="590.0" y="122.0" text-anchor="middle" class="t-small">captures, profiles</text><path d="M498 95 L512 95" class="edge" marker-end="url(#arrow)"/><rect x="682" y="40" width="152" height="110" rx="6" class="guest"/><text x="758.0" y="76.0" text-anchor="middle" class="t-head">5  Record</text><text x="758.0" y="92.0" text-anchor="middle" class="t-small">site/findings TOML,</text><text x="758.0" y="107.0" text-anchor="middle" class="t-small">fh1-symbols.toml,</text><text x="758.0" y="122.0" text-anchor="middle" class="t-small">with a confidence</text><path d="M666 95 L680 95" class="edge" marker-end="url(#arrow)"/><path d="M758 150 L758 185 L86 185 L86 152" class="edge edge-dash" marker-end="url(#arrow)"/><text x="420" y="202" text-anchor="middle" class="t-small">negative results are recorded too, so the next question starts further on</text></svg>
