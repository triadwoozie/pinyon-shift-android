<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="A UI4 scene is three members of media/UI.zip: the BGF with authored items and strings, the BSG scene graph and the FBF native objects with geometry and GPU data. Lua scripts and string tables complete it, and the Gameface runtime builds the screen from them."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="360" height="310" rx="8" class="lane"/><text x="20" y="26" text-anchor="start" class="t-lane">MEDIA/UI.ZIP  SCENES/UI4</text><rect x="25" y="45" width="330" height="75" rx="6" class="guest"/><text x="190.0" y="71.0" text-anchor="middle" class="t-head">&lt;scene&gt;.bgf</text><text x="190.0" y="87.0" text-anchor="middle" class="t-small">authored items: elements, wrappers,</text><text x="190.0" y="102.0" text-anchor="middle" class="t-small">properties and the scene&#x27;s strings</text><rect x="25" y="135" width="330" height="75" rx="6" class="guest"/><text x="190.0" y="161.0" text-anchor="middle" class="t-head">&lt;scene&gt;.bsg</text><text x="190.0" y="177.0" text-anchor="middle" class="t-small">scene graph: 96-byte nodes with a parent</text><text x="190.0" y="192.0" text-anchor="middle" class="t-small">index and a native object ID</text><rect x="25" y="225" width="330" height="75" rx="6" class="guest"/><text x="190.0" y="251.0" text-anchor="middle" class="t-head">&lt;scene&gt;.fbf</text><text x="190.0" y="267.0" text-anchor="middle" class="t-small">native objects: frames, materials,</text><text x="190.0" y="282.0" text-anchor="middle" class="t-small">geometry records and a GPU data block</text><rect x="430" y="110" width="180" height="120" rx="6" class="host"/><text x="520.0" y="143.5" text-anchor="middle" class="t-head">Gameface (UI4)</text><text x="520.0" y="159.5" text-anchor="middle" class="t-small">builds records,</text><text x="520.0" y="174.5" text-anchor="middle" class="t-small">binds text by name</text><text x="520.0" y="189.5" text-anchor="middle" class="t-small">hash, runs the</text><text x="520.0" y="204.5" text-anchor="middle" class="t-small">scripts</text><rect x="650" y="45" width="160" height="60" rx="6" class="box"/><text x="730.0" y="71.0" text-anchor="middle" class="t-head">Lua scripts</text><text x="730.0" y="87.0" text-anchor="middle" class="t-small">screen logic</text><rect x="650" y="140" width="160" height="60" rx="6" class="box"/><text x="730.0" y="166.0" text-anchor="middle" class="t-head">.str tables</text><text x="730.0" y="182.0" text-anchor="middle" class="t-small">text by 16-bit key</text><rect x="650" y="245" width="160" height="60" rx="6" class="gpu"/><text x="730.0" y="271.0" text-anchor="middle" class="t-head">UI pass</text><text x="730.0" y="287.0" text-anchor="middle" class="t-small">EDRAM 1280x720</text><path d="M355 82 L391.5 82 L391.5 135 L428 135" class="edge" marker-end="url(#arrow)"/><path d="M355 172 L391.5 172 L391.5 170 L428 170" class="edge" marker-end="url(#arrow)"/><path d="M355 262 L391.5 262 L391.5 205 L428 205" class="edge" marker-end="url(#arrow)"/><path d="M648 75 L630.0 75 L630.0 140 L612 140" class="edge" marker-end="url(#arrow)"/><path d="M648 170 L612 170" class="edge" marker-end="url(#arrow)"/><path d="M610 205 L629.0 205 L629.0 275 L648 275" class="edge" marker-end="url(#arrow)"/><text x="520" y="262" text-anchor="middle" class="t-small">BGF items and BSG nodes</text><text x="520" y="278" text-anchor="middle" class="t-small">refer to FBF object IDs</text></svg>
