<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-label="Structure of a flow script: a state group holds states; states run behaviours, call states of other groups and exit to targets"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="520" height="330" rx="8" class="lane"/><text x="20" y="26" text-anchor="start" class="t-lane">FLOW FILE  (STATEGROUP)</text><rect x="30" y="50" width="220" height="120" rx="6" class="host"/><text x="140.0" y="113.5" text-anchor="middle" class="t-head">State  A</text><rect x="45" y="95" width="190" height="26" rx="6" class="guest"/><text x="140.0" y="111.5" text-anchor="middle" class="t-small">Behaviour id=CSetTimeOfDay</text><rect x="45" y="129" width="190" height="26" rx="6" class="box"/><text x="140.0" y="145.5" text-anchor="middle" class="t-small t-mono">Node state=global.x</text><rect x="290" y="50" width="220" height="120" rx="6" class="host"/><text x="400.0" y="113.5" text-anchor="middle" class="t-head">State  B</text><rect x="305" y="95" width="190" height="26" rx="6" class="guest"/><text x="400.0" y="111.5" text-anchor="middle" class="t-small">Behaviour id=CPrepareCutscene</text><rect x="305" y="129" width="190" height="26" rx="6" class="box"/><text x="400.0" y="145.5" text-anchor="middle" class="t-small t-mono">Exit target=C</text><path d="M250 80 L288 80" class="edge" marker-end="url(#arrow)"/><text x="269" y="72" text-anchor="middle" class="t-small">Exit</text><rect x="290" y="205" width="220" height="80" rx="6" class="host"/><text x="400.0" y="233.5" text-anchor="middle" class="t-head">State  C</text><text x="400.0" y="249.5" text-anchor="middle" class="t-small">Entry, Transition,</text><text x="400.0" y="264.5" text-anchor="middle" class="t-small">Attribute elements</text><path d="M400 155 L400 203" class="edge" marker-end="url(#arrow)"/><rect x="550" y="10" width="240" height="150" rx="8" class="lane"/><text x="560" y="26" text-anchor="start" class="t-lane">GROUP  GLOBAL</text><rect x="570" y="50" width="200" height="60" rx="6" class="host"/><text x="670.0" y="76.0" text-anchor="middle" class="t-head">State  x</text><text x="670.0" y="92.0" text-anchor="middle" class="t-small">shared by 40 callers</text><rect x="550" y="180" width="240" height="160" rx="8" class="lane"/><text x="560" y="196" text-anchor="start" class="t-lane">EXECUTABLE</text><rect x="570" y="220" width="200" height="75" rx="6" class="guest"/><text x="670.0" y="246.0" text-anchor="middle" class="t-head">States::CSetTimeOfDay</text><text x="670.0" y="262.0" text-anchor="middle" class="t-small">created by name through</text><text x="670.0" y="277.0" text-anchor="middle" class="t-small">CConstructor0 / 2</text><path d="M140 155 L140 300 L535 300 L535 80 L568 80" class="edge edge-dash" marker-end="url(#arrow)"/><path d="M45 108 L22 108 L22 318 L545 318 L545 257 L568 257" class="edge edge-dash" marker-end="url(#arrow)"/><text x="270" y="294" text-anchor="middle" class="t-small">runs a state of another group</text><text x="270" y="312" text-anchor="middle" class="t-small">creates the C++ behaviour</text></svg>
