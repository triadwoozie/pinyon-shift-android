<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-label="Layout of an FH1 ZIP archive: the central directory&#x27;s extra field 0x1123 gives each member&#x27;s payload offset; a method-21 payload is a run of XMem frames"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="20" y="40" width="120" height="70" rx="2" class="box"/><text x="80.0" y="71.0" text-anchor="middle" class="t-head">Local header</text><text x="80.0" y="87.0" text-anchor="middle" class="t-small">may be absent</text><rect x="144" y="40" width="330" height="70" rx="2" class="host"/><text x="309.0" y="71.0" text-anchor="middle" class="t-head">Payload: XMem frames</text><text x="309.0" y="87.0" text-anchor="middle" class="t-small">one frame per 32 KiB of output</text><rect x="478" y="40" width="70" height="70" rx="2" class="box"/><text x="513.0" y="78.5" text-anchor="middle" class="t-head">...</text><rect x="552" y="40" width="228" height="70" rx="2" class="guest"/><text x="666.0" y="63.5" text-anchor="middle" class="t-head">Central directory entry</text><text x="666.0" y="79.5" text-anchor="middle" class="t-small">name, sizes, CRC of the output,</text><text x="666.0" y="94.5" text-anchor="middle" class="t-small">extra 0x1123: payload offset</text><path d="M666 112 L666 128 L300 128 L300 112" class="edge edge-dash" marker-end="url(#arrow)"/><text x="483" y="142" text-anchor="middle" class="t-small">u32 LE, absolute in the file</text><rect x="144" y="170" width="160" height="70" rx="2" class="host"/><text x="224.0" y="193.5" text-anchor="middle" class="t-head">Full frame</text><text x="224.0" y="209.5" text-anchor="middle" class="t-small">u16 BE block size,</text><text x="224.0" y="224.5" text-anchor="middle" class="t-small">LZX block</text><rect x="314" y="170" width="196" height="70" rx="2" class="host"/><text x="412.0" y="193.5" text-anchor="middle" class="t-head">Last frame</text><text x="412.0" y="209.5" text-anchor="middle" class="t-small">0xFF, u16 BE output size,</text><text x="412.0" y="224.5" text-anchor="middle" class="t-small">u16 BE block size</text><path d="M224 112 L224 168" class="edge edge-dash" marker-end="url(#arrow)"/><path d="M420 112 L412 168" class="edge edge-dash" marker-end="url(#arrow)"/><rect x="540" y="170" width="250" height="70" rx="2" class="box"/><text x="665.0" y="193.5" text-anchor="middle" class="t-head">LZX stream</text><text x="665.0" y="209.5" text-anchor="middle" class="t-small">frame bodies joined; 64 KiB</text><text x="665.0" y="224.5" text-anchor="middle" class="t-small">window (128 or 32 KiB fallback)</text></svg>
