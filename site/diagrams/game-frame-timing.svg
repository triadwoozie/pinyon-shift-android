<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" role="img" aria-label="Frame timing: the simulation steps every second vblank; the render thread draws a finished step, idles until the next, and the swap lands on a whole vblank"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><path d="M135.0 30 L135.0 285" class="edge edge-dash"/><text x="135.0" y="24" text-anchor="middle" class="t-small">vblank 0</text><path d="M292.5 30 L292.5 285" class="edge edge-dash"/><text x="292.5" y="24" text-anchor="middle" class="t-small">vblank 1</text><path d="M450.0 30 L450.0 285" class="edge edge-dash"/><text x="450.0" y="24" text-anchor="middle" class="t-small">vblank 2</text><path d="M607.5 30 L607.5 285" class="edge edge-dash"/><text x="607.5" y="24" text-anchor="middle" class="t-small">vblank 3</text><path d="M765.0 30 L765.0 285" class="edge edge-dash"/><text x="765.0" y="24" text-anchor="middle" class="t-small">vblank 4</text><text x="124" y="80" text-anchor="end" class="t-head">Simulation</text><text x="124" y="140" text-anchor="end" class="t-head">Render thread</text><text x="124" y="200" text-anchor="end" class="t-head">GPU</text><text x="124" y="260" text-anchor="end" class="t-head">Display</text><rect x="139" y="60" width="149.625" height="30" rx="6" class="host"/><text x="213.8125" y="78.5" text-anchor="middle" class="t-small">step n</text><rect x="454.0" y="60" width="149.625" height="30" rx="6" class="host"/><text x="528.8125" y="78.5" text-anchor="middle" class="t-small">step n+1</text><rect x="298.8" y="120" width="135.45" height="30" rx="6" class="gpu"/><text x="366.525" y="138.5" text-anchor="middle" class="t-small">draw step n</text><rect x="442.125" y="120" width="165.375" height="30" rx="6" class="box"/><text x="524.8125" y="138.5" text-anchor="middle" class="t-small">idle: SleepEx(0, TRUE)</text><rect x="613.8" y="120" width="135.45" height="30" rx="6" class="gpu"/><text x="681.525" y="138.5" text-anchor="middle" class="t-small">draw step n+1</text><rect x="371.25" y="180" width="173.25" height="30" rx="6" class="gpu"/><text x="457.875" y="198.5" text-anchor="middle" class="t-small">execute frame n</text><rect x="607.5" y="240" width="154.35" height="30" rx="6" class="box"/><text x="684.675" y="258.5" text-anchor="middle" class="t-small">show frame n</text><path d="M295.65 92 L295.65 118" class="edge" marker-end="url(#arrow)"/><path d="M379.125 152 L379.125 178" class="edge" marker-end="url(#arrow)"/><path d="M544.5 212 L607.5 238" class="edge" marker-end="url(#arrow)"/><text x="684.6750000000001" y="303" text-anchor="middle" class="t-small">swap on the next whole vblank</text></svg>
