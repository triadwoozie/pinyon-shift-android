<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="How a Forza Horizon profile is saved and loaded: the value tree is serialised to a plaintext body, encrypted with XeKeysAesCbcUsingKey and written; on load the file is decrypted before parsing. Mod hooks see the plaintext on both paths."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="800" height="130" rx="8" class="lane"/><text x="20" y="26" text-anchor="start" class="t-lane">SAVE</text><rect x="25" y="45" width="150" height="70" rx="6" class="host"/><text x="100.0" y="68.5" text-anchor="middle" class="t-head">profile values</text><text x="100.0" y="84.5" text-anchor="middle" class="t-small">value tree, class</text><text x="100.0" y="99.5" text-anchor="middle" class="t-small">states (in memory)</text><rect x="205" y="45" width="190" height="70" rx="6" class="guest"/><text x="300.0" y="68.5" text-anchor="middle" class="t-head">plaintext body</text><text x="300.0" y="84.5" text-anchor="middle" class="t-small t-mono">0x82C666D0</text><text x="300.0" y="99.5" text-anchor="middle" class="t-small t-mono">r4 body, r5 size</text><rect x="425" y="45" width="190" height="70" rx="6" class="box"/><text x="520.0" y="68.5" text-anchor="middle" class="t-head">AES-CBC encrypt</text><text x="520.0" y="84.5" text-anchor="middle" class="t-small t-mono">sub_82C665F8</text><text x="520.0" y="99.5" text-anchor="middle" class="t-small t-mono">XeKeysAesCbcUsingKey</text><rect x="645" y="45" width="155" height="70" rx="6" class="gpu"/><text x="722.5" y="68.5" text-anchor="middle" class="t-head">profile directory</text><text x="722.5" y="84.5" text-anchor="middle" class="t-small">ForzaProfile,</text><text x="722.5" y="99.5" text-anchor="middle" class="t-small">PlayerDatabase, ...</text><path d="M175 80 L203 80" class="edge" marker-end="url(#arrow)"/><path d="M395 80 L423 80" class="edge" marker-end="url(#arrow)"/><path d="M615 80 L643 80" class="edge" marker-end="url(#arrow)"/><text x="300" y="132" text-anchor="middle" class="t-small">SAVE_BEFORE_ENCRYPT hook</text><rect x="10" y="155" width="800" height="130" rx="8" class="lane"/><text x="20" y="171" text-anchor="start" class="t-lane">LOAD</text><rect x="25" y="190" width="150" height="70" rx="6" class="gpu"/><text x="100.0" y="221.0" text-anchor="middle" class="t-head">profile directory</text><text x="100.0" y="237.0" text-anchor="middle" class="t-small">file read</text><rect x="205" y="190" width="190" height="70" rx="6" class="box"/><text x="300.0" y="213.5" text-anchor="middle" class="t-head">AES-CBC decrypt</text><text x="300.0" y="229.5" text-anchor="middle" class="t-small t-mono">sub_82C66308</text><text x="300.0" y="244.5" text-anchor="middle" class="t-small t-mono">(r8 = 0)</text><rect x="425" y="190" width="190" height="70" rx="6" class="guest"/><text x="520.0" y="213.5" text-anchor="middle" class="t-head">plaintext body</text><text x="520.0" y="229.5" text-anchor="middle" class="t-small t-mono">0x82C66594</text><text x="520.0" y="244.5" text-anchor="middle" class="t-small t-mono">r30 body ptr, r24 size</text><rect x="645" y="190" width="155" height="70" rx="6" class="host"/><text x="722.5" y="213.5" text-anchor="middle" class="t-head">parse</text><text x="722.5" y="229.5" text-anchor="middle" class="t-small">self-describing</text><text x="722.5" y="244.5" text-anchor="middle" class="t-small">section, then states</text><path d="M175 225 L203 225" class="edge" marker-end="url(#arrow)"/><path d="M395 225 L423 225" class="edge" marker-end="url(#arrow)"/><path d="M615 225 L643 225" class="edge" marker-end="url(#arrow)"/><text x="510" y="277" text-anchor="middle" class="t-small">SAVE_AFTER_DECRYPT hook</text></svg>
