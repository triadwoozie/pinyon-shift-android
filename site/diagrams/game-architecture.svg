<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="How Forza Horizon is organised at run time: data files drive a simulation thread, which hands work to the render and audio threads through deferred command queues"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="198" height="450" rx="8" class="lane"/><text x="20" y="26" text-anchor="start" class="t-lane">DATA ON DISC</text><rect x="25" y="40" width="168" height="62" rx="6" class="guest"/><text x="109.0" y="59.5" text-anchor="middle" class="t-head">gamemodes.zip</text><text x="109.0" y="75.5" text-anchor="middle" class="t-small">flow state graphs,</text><text x="109.0" y="90.5" text-anchor="middle" class="t-small">activities, cutscenes</text><rect x="25" y="118" width="168" height="62" rx="6" class="guest"/><text x="109.0" y="137.5" text-anchor="middle" class="t-head">gamedb.slt</text><text x="109.0" y="153.5" text-anchor="middle" class="t-small">SQLite: cars, events,</text><text x="109.0" y="168.5" text-anchor="middle" class="t-small">upgrades, AI, rewards</text><rect x="25" y="196" width="168" height="62" rx="6" class="guest"/><text x="109.0" y="215.5" text-anchor="middle" class="t-head">renderscenarios.zip</text><text x="109.0" y="231.5" text-anchor="middle" class="t-small">render settings</text><text x="109.0" y="246.5" text-anchor="middle" class="t-small">per game situation</text><rect x="25" y="274" width="168" height="62" rx="6" class="guest"/><text x="109.0" y="293.5" text-anchor="middle" class="t-head">tracks, cars, ui</text><text x="109.0" y="309.5" text-anchor="middle" class="t-small">XMem ZIP archives of</text><text x="109.0" y="324.5" text-anchor="middle" class="t-small">models, textures, UI</text><rect x="25" y="352" width="168" height="62" rx="6" class="guest"/><text x="109.0" y="371.5" text-anchor="middle" class="t-head">audio</text><text x="109.0" y="387.5" text-anchor="middle" class="t-small">FMOD banks (.fsb),</text><text x="109.0" y="402.5" text-anchor="middle" class="t-small">radio, engines</text><rect x="220" y="10" width="270" height="450" rx="8" class="lane"/><text x="230" y="26" text-anchor="start" class="t-lane">SIMULATION THREAD 8255AE10</text><rect x="240" y="40" width="230" height="74" rx="6" class="box"/><text x="355.0" y="65.5" text-anchor="middle" class="t-head">Vblank callback</text><text x="355.0" y="81.5" text-anchor="middle" class="t-small">raises the step event every</text><text x="355.0" y="96.5" text-anchor="middle" class="t-small">second vblank (30 Hz step)</text><rect x="240" y="134" width="230" height="74" rx="6" class="host"/><text x="355.0" y="159.5" text-anchor="middle" class="t-head">Flow state machine</text><text x="355.0" y="175.5" text-anchor="middle" class="t-small">XML states run States::</text><text x="355.0" y="190.5" text-anchor="middle" class="t-small">behaviour classes by name</text><rect x="240" y="228" width="230" height="92" rx="6" class="host"/><text x="355.0" y="255.0" text-anchor="middle" class="t-head">Game objects</text><text x="355.0" y="271.0" text-anchor="middle" class="t-small">world, session, time of day,</text><text x="355.0" y="286.0" text-anchor="middle" class="t-small">vehicle slots, activities,</text><text x="355.0" y="301.0" text-anchor="middle" class="t-small">profile and career</text><rect x="240" y="340" width="230" height="92" rx="6" class="box"/><text x="355.0" y="367.0" text-anchor="middle" class="t-head">Deferred commands</text><text x="355.0" y="383.0" text-anchor="middle" class="t-small">602 CParams types under</text><text x="355.0" y="398.0" text-anchor="middle" class="t-small">24 Deferred / Link owners:</text><text x="355.0" y="413.0" text-anchor="middle" class="t-small">render, presentation, audio</text><path d="M355 114 L355 132" class="edge" marker-end="url(#arrow)"/><path d="M355 208 L355 226" class="edge" marker-end="url(#arrow)"/><path d="M355 320 L355 338" class="edge" marker-end="url(#arrow)"/><rect x="510" y="10" width="280" height="450" rx="8" class="lane"/><text x="520" y="26" text-anchor="start" class="t-lane">OTHER GUEST THREADS</text><rect x="530" y="40" width="240" height="74" rx="6" class="gpu"/><text x="650.0" y="65.5" text-anchor="middle" class="t-head">Render thread 825A6320</text><text x="650.0" y="81.5" text-anchor="middle" class="t-small">frame sub_8259F3E8: draws,</text><text x="650.0" y="96.5" text-anchor="middle" class="t-small">resolves, VdSwap, fence wait</text><rect x="530" y="134" width="240" height="54" rx="6" class="gpu"/><text x="650.0" y="157.0" text-anchor="middle" class="t-head">GPU (Xenos)</text><text x="650.0" y="173.0" text-anchor="middle" class="t-small">ring buffer, EDRAM, resolves</text><rect x="530" y="208" width="240" height="54" rx="6" class="box"/><text x="650.0" y="231.0" text-anchor="middle" class="t-head">Audio thread 82FB4AF8</text><text x="650.0" y="247.0" text-anchor="middle" class="t-small">mixing, reverb, XMA</text><rect x="530" y="282" width="240" height="54" rx="6" class="box"/><text x="650.0" y="305.0" text-anchor="middle" class="t-head">Job workers 82C0C8C8</text><text x="650.0" y="321.0" text-anchor="middle" class="t-small">eleven threads, bursts</text><rect x="530" y="356" width="240" height="74" rx="6" class="box"/><text x="650.0" y="381.5" text-anchor="middle" class="t-head">Asset workers</text><text x="650.0" y="397.5" text-anchor="middle" class="t-small">LZX and inflate decoders,</text><text x="650.0" y="412.5" text-anchor="middle" class="t-small">streaming track and car data</text><path d="M650 114 L650 132" class="edge" marker-end="url(#arrow)"/><path d="M470 386 L499.0 386 L499.0 77 L528 77" class="edge" marker-end="url(#arrow)"/><path d="M470 386 L499.0 386 L499.0 235 L528 235" class="edge" marker-end="url(#arrow)"/><path d="M193 71 L214 71 L214 171 L238 171" class="edge" marker-end="url(#arrow)"/><path d="M193 149 L216 149 L216 274 L238 274" class="edge" marker-end="url(#arrow)"/><path d="M193 227 L218 227 L218 248 L238 248" class="edge edge-dash" marker-end="url(#arrow)"/><path d="M528 393 L505 393 L505 300 L472 300" class="edge edge-dash" marker-end="url(#arrow)"/><path d="M193 305 L203 305 L203 445 L650 445 L650 432" class="edge edge-dash" marker-end="url(#arrow)"/></svg>
