<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="How title update 4 is applied: each .xexp patch holds a header delta and an LZX image delta applied to the matching disc module, and the update&#x27;s media.zip is mounted over the disc&#x27;s media so its members win."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="10" y="10" width="250" height="260" rx="8" class="lane"/><text x="20" y="26" text-anchor="start" class="t-lane">USA DISC  (0.0.0.10)</text><rect x="25" y="45" width="220" height="55" rx="6" class="guest"/><text x="135.0" y="68.5" text-anchor="middle" class="t-head">default.xex</text><text x="135.0" y="84.5" text-anchor="middle" class="t-small">24.6 MB image</text><rect x="25" y="115" width="220" height="55" rx="6" class="guest"/><text x="135.0" y="138.5" text-anchor="middle" class="t-head">two facade modules</text><text x="135.0" y="154.5" text-anchor="middle" class="t-small">Speech and XMedia facades</text><rect x="25" y="195" width="220" height="55" rx="6" class="box"/><text x="135.0" y="218.5" text-anchor="middle" class="t-head">media/</text><text x="135.0" y="234.5" text-anchor="middle" class="t-small">archives, XML, banks</text><rect x="290" y="10" width="240" height="260" rx="8" class="lane"/><text x="300" y="26" text-anchor="start" class="t-lane">TITLE UPDATE PACKAGE (STFS)</text><rect x="305" y="45" width="210" height="55" rx="6" class="guest"/><text x="410.0" y="68.5" text-anchor="middle" class="t-head">default.xexp</text><text x="410.0" y="84.5" text-anchor="middle" class="t-small">header + LZX image delta</text><rect x="305" y="115" width="210" height="55" rx="6" class="guest"/><text x="410.0" y="138.5" text-anchor="middle" class="t-head">facade .xexp x2</text><text x="410.0" y="154.5" text-anchor="middle" class="t-small">also replace the module key</text><rect x="305" y="195" width="210" height="55" rx="6" class="box"/><text x="410.0" y="218.5" text-anchor="middle" class="t-head">media.zip</text><text x="410.0" y="234.5" text-anchor="middle" class="t-small">918 files: Rally, database</text><rect x="570" y="45" width="240" height="125" rx="6" class="host"/><text x="690.0" y="81.0" text-anchor="middle" class="t-head">v4 images</text><text x="690.0" y="97.0" text-anchor="middle" class="t-small">default.xex 25.8 MB,</text><text x="690.0" y="112.0" text-anchor="middle" class="t-small">reports 0.0.4.10;</text><text x="690.0" y="127.0" text-anchor="middle" class="t-small">page hashes match v4&#x27;s</text><text x="690.0" y="142.0" text-anchor="middle" class="t-small">own (371/371)</text><rect x="570" y="195" width="240" height="55" rx="6" class="host"/><text x="690.0" y="218.5" text-anchor="middle" class="t-head">media seen by the game</text><text x="690.0" y="234.5" text-anchor="middle" class="t-small">update members win</text><path d="M245 72 L303 72" class="edge" marker-end="url(#arrow)"/><path d="M245 142 L303 142" class="edge" marker-end="url(#arrow)"/><path d="M515 72 L568 72" class="edge" marker-end="url(#arrow)"/><path d="M515 142 L568 142" class="edge" marker-end="url(#arrow)"/><path d="M135 250 L135 262 L690 262 L690 252" class="edge" marker-end="url(#arrow)"/><path d="M515 222 L568 222" class="edge" marker-end="url(#arrow)"/></svg>
